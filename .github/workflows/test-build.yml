name: Test Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            artifact-name: windows
          - os: ubuntu-22.04
            artifact-name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          enable_cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-build-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
            cargo-build-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            fuse \
            desktop-file-utils \
            appstream

      - name: Configure Linux build environment
        if: runner.os == 'Linux'
        run: |
          sudo modprobe fuse || true
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV
          echo "NO_STRIP=1" >> $GITHUB_ENV
          echo "TAURI_SKIP_DEVTOOLS=true" >> $GITHUB_ENV

      - name: Build Tauri App
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
          ARCH: x86_64

      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging-portable
          New-Item -ItemType Directory -Force -Path staging-portable/deps
          Copy-Item "src-tauri/target/release/cheezy-launcher.exe" staging-portable
          if (Test-Path "src-tauri/deps/xdelta3.exe") { Copy-Item "src-tauri/deps/xdelta3.exe" staging-portable/deps }
          if (Test-Path "src-tauri/deps/cheezylauncher-steamhelper.exe") { Copy-Item "src-tauri/deps/cheezylauncher-steamhelper.exe" staging-portable/deps }
          Compress-Archive -Path "staging-portable/*" -DestinationPath "Cheezy.Launcher_windows-portable.zip"


      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ matrix.artifact-name }}
          path: |
            *.zip
            src-tauri/target/release/bundle/**
