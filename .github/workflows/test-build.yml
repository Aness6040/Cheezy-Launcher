name: Test Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Tauri App
        run: pnpm tauri build

      - name: Zip Windows executable
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter *.exe -Recurse | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "Cheezy.Launcher_windows.zip"

      - name: Tar.gz Linux executable
        if: matrix.name == 'linux'
        run: |
          EXE=$(find src-tauri/target/release -type f -executable | head -n 1)
          tar -czvf Cheezy.Launcher_linux.tar.gz -C "$(dirname "$EXE")" "$(basename "$EXE")"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**
            *.zip
            *.tar.gz