name: Test Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            fuse \
            desktop-file-utils \
            appstream
      
      - name: Enable FUSE for AppImage
        if: matrix.name == 'linux'
        run: |
          sudo modprobe fuse || true
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV
          echo "USE_SYSTEM_FUSE=1" >> $GITHUB_ENV

      - name: Fix linuxdeploy environment
        if: matrix.name == 'linux'
        run: |
          echo "NO_STRIP=1" >> $GITHUB_ENV
          echo "TAURI_SKIP_DEVTOOLS=true" >> $GITHUB_ENV

      - name: Build Tauri App
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Zip Windows executable (FULL)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "src-tauri/target/release/bundle/*" `
            -DestinationPath "Cheezy.Launcher_windows.zip"

      - name: Tar.gz Linux bundle
        if: matrix.name == 'linux'
        run: |
          tar -czvf Cheezy.Launcher_linux.tar.gz \
            -C src-tauri/target/release/bundle \
            .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**
            *.zip
            *.tar.gz