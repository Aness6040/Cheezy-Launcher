name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            artifact-name: windows
            bundle-ext: zip
          - os: ubuntu-22.04
            artifact-name: linux
            bundle-ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          enable_cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-build-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
            cargo-build-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            fuse \
            desktop-file-utils \
            appstream

      - name: Configure Linux build environment
        if: runner.os == 'Linux'
        run: |
          sudo modprobe fuse || true
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV
          echo "NO_STRIP=1" >> $GITHUB_ENV
          echo "TAURI_SKIP_DEVTOOLS=true" >> $GITHUB_ENV

      - name: Build Tauri App
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}

      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_portable.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($portableExe) {
            Copy-Item $portableExe.FullName "Cheezy.Launcher_${{ github.ref_name }}_portable.exe"
            Compress-Archive -Path "Cheezy.Launcher_${{ github.ref_name }}_portable.exe" -DestinationPath "Cheezy.Launcher_${{ github.ref_name }}_windows-portable.zip"
          }

      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: |
          tar -czvf "Cheezy.Launcher_${{ github.ref_name }}_linux.tar.gz" -C src-tauri/target/release/bundle .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            *.zip
            *.tar.gz
            src-tauri/target/release/bundle/msi/**
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate changelog
        id: commits
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Cheezy Launcher ${{ github.ref_name }}"
          body: |
            ## Cheezy Launcher ${{ github.ref_name }}

            ### 📥 Download Guide — which file to pick?

            | Platform | File | Description |
            |----------|------|-------------|
            | Windows | `*_x64-setup.exe` | NSIS installer (recommended for most users) |
            | Windows | `*_x64_en-US.msi` | MSI installer (enterprise deployment) |
            | Windows | `*_x64_portable.exe` | **Portable** no installation, just run |
            | Linux | `*_amd64.AppImage` | AppImage (works on any distro) |
            | Linux | `*_amd64.deb` | Debian/Ubuntu package |
            | Linux | `*.x86_64.rpm` | Fedora/RHEL package |

            > 💡 On Windows, the **portable `.exe`** needs no installation, just download and run.

            ### Commits:
            ${{ steps.commits.outputs.body }}

            ### Info:
            - Tag: ${{ github.ref_name }}
          files: |
            *.zip
            *.tar.gz
            **/*.msi
            **/*setup.exe
            **/*_portable.exe
