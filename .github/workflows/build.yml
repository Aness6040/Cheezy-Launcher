name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            artifact-name: windows
          - os: ubuntu-22.04
            artifact-name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          enable_cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure Windows symlinks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.symlinks true
          echo "MSYS=winsymlinks:nativestrict" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM/Clang (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-build-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
            cargo-build-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            clang \
            llvm-dev \
            lld \
            fuse \
            desktop-file-utils \
            appstream

      - name: Configure Linux build environment
        if: runner.os == 'Linux'
        run: |
          sudo modprobe fuse || true
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV
          echo "NO_STRIP=1" >> $GITHUB_ENV
          echo "TAURI_SKIP_DEVTOOLS=true" >> $GITHUB_ENV
          echo "USE_SYSTEM_FUSE=1" >> $GITHUB_ENV

      - name: Setup AppImage tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eux

          TOOLS_DIR="$HOME/.tauri/appimage-tools"
          mkdir -p "$TOOLS_DIR"

          # Download linuxdeploy (pinned to a specific release for reproducibility)
          LINUXDEPLOY_URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          LINUXDEPLOY_PATH="$TOOLS_DIR/linuxdeploy-x86_64.AppImage"

          if [ ! -f "$LINUXDEPLOY_PATH" ]; then
            echo "Downloading linuxdeploy..."
            wget -q --show-progress "$LINUXDEPLOY_URL" -O "$LINUXDEPLOY_PATH"
          fi
          chmod +x "$LINUXDEPLOY_PATH"

          # Download linuxdeploy-plugin-gtk
          GTK_PLUGIN_URL="https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          GTK_PLUGIN_PATH="$TOOLS_DIR/linuxdeploy-plugin-gtk.sh"

          if [ ! -f "$GTK_PLUGIN_PATH" ]; then
            echo "Downloading linuxdeploy-plugin-gtk..."
            wget -q --show-progress "$GTK_PLUGIN_URL" -O "$GTK_PLUGIN_PATH"
          fi
          chmod +x "$GTK_PLUGIN_PATH"

          # Verify linuxdeploy works with APPIMAGE_EXTRACT_AND_RUN
          echo "Verifying linuxdeploy..."
          APPIMAGE_EXTRACT_AND_RUN=1 "$LINUXDEPLOY_PATH" --list-plugins 2>&1 || echo "WARNING: linuxdeploy verification failed (may still work during build)"

          echo "APPIMAGE_BUNDLE_TOOLS_DIR=$TOOLS_DIR" >> $GITHUB_ENV
          echo "AppImage tools ready at: $TOOLS_DIR"
          ls -la "$TOOLS_DIR"

      - name: Install Steam API library for AppImage
        if: runner.os == 'Linux'
        run: |
          # Pre-build steamhelper to trigger steamworks-sdk-redist download
          cargo build --release --bin cheezylauncher-steamhelper --manifest-path src-tauri/Cargo.toml
          # Copy libsteam_api.so to /usr/lib/ so linuxdeploy can bundle it
          STEAM_API_LIB=$(find src-tauri/target/release/build -name 'libsteam_api.so' 2>/dev/null | head -1)
          if [ -n "$STEAM_API_LIB" ]; then
            sudo cp "$STEAM_API_LIB" /usr/lib/
            sudo ldconfig
            echo "Installed libsteam_api.so from $STEAM_API_LIB"
          else
            echo "ERROR: Could not find libsteam_api.so in build artifacts"
            exit 1
          fi

      - name: Build Tauri App
        run: pnpm tauri build --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
          ARCH: x86_64

      - name: Copy PKGBUILD for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="src-tauri/target/release/bundle/deb/cheezy-launcher_${VERSION}_amd64.deb"
          SHA=$(sha256sum "$DEB" | cut -d' ' -f1)
          sed "s/__VERSION__/${VERSION}/;s/__SHA256__/${SHA}/" .github/PKGBUILD > src-tauri/target/release/bundle/PKGBUILD
          cp .github/cheezy-launcher.install src-tauri/target/release/bundle/

      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/cheezy-launcher.exe" staging-portable
          if (Test-Path "src-tauri/cheezylauncher-steamhelper.exe") { Copy-Item "src-tauri/cheezylauncher-steamhelper.exe" staging-portable }
          @"
          Cheezy Launcher - Portable Build
          =================================

          This is a portable build of Cheezy Launcher.

          ⚠ NOTE: Tauri does NOT officially support portable/portable mode.
            - The auto-updater may NOT work in this build.
            - Some features may behave differently.

          ✅ PREREQUISITES:
            - WebView2 Runtime (required by Tauri):
              If you don't have it, download and install from:
              https://developer.microsoft.com/en-us/microsoft-edge/webview2/
              (On Windows 11, WebView2 is included by default.)

          📦 USAGE:
            1. Extract all files to a folder (e.g. C:\CheezyLauncher)
            2. Run cheezy-launcher.exe
            3. (Optional) Run as Administrator for better performance with symlinks

          ❓ NEED HELP?
            https://github.com/Aness6040/Cheezy-Launcher/issues
          "@ | Out-File -FilePath staging-portable/README.txt -Encoding utf8
          Compress-Archive -Path "staging-portable/*" -DestinationPath "Cheezy.Launcher_${{ github.ref_name }}_windows-portable.zip"


      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            *.zip
            src-tauri/target/release/bundle/**

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate changelog
        id: commits
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Cheezy Launcher ${{ github.ref_name }}"
          body: |
            ## Cheezy Launcher ${{ github.ref_name }}

            ### 📥 Download Guide — which file to pick?

            | Platform | File | Description |
            |----------|------|-------------|
            | Windows | `*_x64-setup.exe` | NSIS installer (recommended for most users) |
            | Windows | `*_x64_en-US.msi` | MSI installer (enterprise deployment) |
            | Windows | `*_windows-portable.zip` | **Portable** — no installation, just unzip and run |
            | Linux | `*_amd64.AppImage` | **Portable** — no installation, just run (AppImage) |
            | Linux | `*_amd64.deb` | Debian/Ubuntu package |
            | Linux | `*.x86_64.rpm` | Fedora/RHEL package |
            | Linux | `PKGBUILD` + `cheezy-launcher.install` | Arch Linux (pacman -U ./cheezy-launcher-*.pkg.tar.zst) |

            > 💡 On Windows, the **portable zip** needs no installation, just unzip and run.

            ### Commits:
            ${{ steps.commits.outputs.body }}

            ### Info:
            - Tag: ${{ github.ref_name }}
          files: |
            *.zip
            **/*.msi
            **/*setup.exe
            **/*.AppImage
            **/*.deb
            **/*.rpm
            **/PKGBUILD
            **/*.install
